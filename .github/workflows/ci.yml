name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r starter/requirements.txt
          pip install -e starter/
          pip install flake8

      - name: Train model
        run: |
          cd starter
          python -m starter.train_model

      - name: Lint with flake8
        run: |
          flake8 starter/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=starter/sanitycheck.py
          flake8 starter/ --count --max-complexity=10 --max-line-length=127 --statistics --exclude=starter/sanitycheck.py

      - name: Run tests with pytest
        run: |
          cd starter
          python -m pytest tests/ -v
